<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ClipMax{% endblock %} · {{ evento }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
<header>
  <div class="logo">Clip<span>Max</span> <span class="mut small">· {{ evento }}</span></div>
  <nav>
    <a href="{{ url_for('index') }}" class="{{ 'on' if request.endpoint == 'index' }}">Panel</a>
    <a href="{{ url_for('sessions_page') }}" class="{{ 'on' if request.endpoint in ('sessions_page', 'session_page') }}">Sesiones</a>
    <a href="{{ url_for('config_page') }}" class="{{ 'on' if request.endpoint in ('config_page', 'config_yaml', 'camera_page') }}">Configuración</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
